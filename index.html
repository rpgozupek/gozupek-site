<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Google Oturum Açma ve Kullanıcı Verisi Kaydetme</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; text-align: center; background-color: #f4f4f4; color: #333; }
        .container { max-width: 600px; margin: 30px auto; background-color: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #0056b3; margin-bottom: 20px; }
        #brand-title { display: none; font-size: 72px; font-weight: 900; letter-spacing: 8px; color: #0056b3; margin: 20px 0 10px; text-transform: uppercase; }
        #auth-container { margin-bottom: 25px; }
        #user-info, #user-data-form, #saved-user-data {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            text-align: left;
            background-color: #f9f9f9;
        }
        #user-info { display: none; } /* Başlangıçta gizli */
        #user-data-form, #saved-user-data { display: none; } /* Başlangıçta gizli */

        #user-data-form label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; color: #555; }
        #user-data-form input[type="number"],
        #user-data-form input[type="text"] {
            width: calc(100% - 22px); /* Padding ve border için ayarlama */
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Padding ve border'ı genişlik içine dahil et */
        }
        button {
            padding: 10px 20px;
            margin: 8px 5px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        #google-signin-button { background-color: #4285f4; color: white; border: none; }
        #google-signin-button:hover { background-color: #357ae8; }
        #signout-button { background-color: #ea4335; color: white; border: none; }
        #signout-button:hover { background-color: #d83427; }
        #save-user-data-button { background-color: #28a745; color: white; border: none; }
        #save-user-data-button:hover { background-color: #218838; }

        .data-label { font-weight: bold; margin-top: 10px; display: inline-block; width: 120px; }
        .data-value { margin-left: 5px; color: #007bff; }
        #user-photo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-top: 10px;
            display: none;
            vertical-align: middle;
            border: 2px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Firebaseee</h1>
        <div id="brand-title">GÖZÜPEK t</div>

        <div id="auth-container">
            <button id="google-signin-button">Google ile Oturum Aç</button>
            <button id="signout-button" style="display: none;">Oturumu Kapat</button>
        </div>

        <div id="user-info">
            <h2>Hoş Geldiniz!</h2>
            <p><span class="data-label">Kullanıcı Adı:</span> <span id="user-display-name" class="data-value"></span></p>
            <p><span class="data-label">E-posta:</span> <span id="user-email" class="data-value"></span></p>
            <p><span class="data-label">UID:</span> <span id="user-uid" class="data-value"></span></p>
            <img id="user-photo" src="" alt="Kullanıcı Fotoğrafı">
        </div>

        <!-- Kullanıcı Verisi Giriş Alanı -->
        <div id="user-data-form">
            <h2>Kişisel Bilgilerinizi Girin</h2>
            <label for="user-age">Yaş:</label>
            <input type="number" id="user-age" placeholder="Yaşınızı girin">

            <label for="user-team">Tuttuğu Takım:</label>
            <input type="text" id="user-team" placeholder="Tuttuğunuz takımı girin">

            <label for="user-car-model">Araba Modeli:</label>
            <input type="text" id="user-car-model" placeholder="Araba modelinizi girin">

            <button id="save-user-data-button">Bilgileri Kaydet</button>
        </div>
        <div id="device-management" style="display: none;">
            <h2>Cihazlarım</h2>
    
            <div style="margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px;">
            <input type="text" id="new-device-id" placeholder="Seri Kodu (Örn: ESP-A3F2B1)" style="text-transform:uppercase;">
            <input type="text" id="new-device-name" placeholder="Cihaz Adı (Örn: Salon)">
            <button id="add-device-button" style="background-color: #007bff; color: white; border: none;">Cihaz Ekle</button>
    </div>

    <div id="device-list">
        <p>Yükleniyor...</p>
    </div>
</div>

        <!-- Kaydedilen Kullanıcı Verilerini Gösterme Alanı -->
        <div id="saved-user-data">
            <h2>Kaydedilmiş Bilgileriniz</h2>
            <p><span class="data-label">Yaş:</span> <span id="display-age" class="data-value"></span></p>
            <p><span class="data-label">Tuttuğu Takım:</span> <span id="display-team" class="data-value"></span></p>
            <p><span class="data-label">Araba Modeli:</span> <span id="display-car-model" class="data-value"></span></p>
        </div>
    </div>

    <!-- Firebase SDK Yükleme -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        // 1. Firebase Yapılandırması (Senin mevcut config bilgilerin)
const firebaseConfig = {
    apiKey: "AIzaSyAK1NJ-dfAkrqESYN1ort95UnGJg-YWxAE",
    authDomain: "website-gozupekteknoloji.firebaseapp.com",
    projectId: "website-gozupekteknoloji",
    storageBucket: "website-gozupekteknoloji.firebasestorage.app",
    messagingSenderId: "941332210669",
    appId: "1:941332210669:web:9547087e4a6d126c173de4",
    measurementId: "G-RPLGF3F943"
};

// 2. Firebase'i Başlat
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

// 3. HTML Element Referansları
const googleSignInButton = document.getElementById('google-signin-button');
const signOutButton = document.getElementById('signout-button');
const userInfoDiv = document.getElementById('user-info');
const userDataForm = document.getElementById('user-data-form');
const deviceManagementDiv = document.getElementById('device-management');
const deviceListDiv = document.getElementById('device-list');
const addDeviceButton = document.getElementById('add-device-button');
const newDeviceIdInput = document.getElementById('new-device-id');
const newDeviceNameInput = document.getElementById('new-device-name');

// 4. OTURUM İŞLEMLERİ
googleSignInButton.addEventListener('click', async () => {
    const googleProvider = new firebase.auth.GoogleAuthProvider();
    try {
        await auth.signInWithPopup(googleProvider);
    } catch (error) {
        console.error("Giriş hatası:", error);
        alert("Oturum açılamadı: " + error.message);
    }
});

signOutButton.addEventListener('click', () => {
    auth.signOut().catch(err => alert("Çıkış hatası: " + err.message));
});

// 5. CİHAZ YÖNETİMİ
addDeviceButton.addEventListener('click', async () => {
    const user = auth.currentUser;
    const deviceId = newDeviceIdInput.value.trim().toUpperCase();
    const deviceName = newDeviceNameInput.value.trim();

    if (!user || !deviceId || !deviceName) {
        alert("Lütfen tüm alanları doldurun.");
        return;
    }

    try {
        addDeviceButton.disabled = true;
        addDeviceButton.textContent = "Kontrol ediliyor...";

        const docRef = db.collection("devices").doc(deviceId);
        const docSnap = await docRef.get();

        if (!docSnap.exists) {
            alert("Bu seri koda sahip bir cihaz bulunamadı.\nLütfen ESP32'nin açık olduğundan ve seri kodunu doğru girdiğinizden emin olun.");
            return;
        }

        const data = docSnap.data();
        if (data.ownerUid) {
            if (data.ownerUid === user.uid) {
                alert("Bu cihaz zaten sizin hesabınıza kayıtlı.");
            } else {
                alert("Bu cihaz başka bir hesaba kayıtlı. Farklı bir seri kod deneyin.");
            }
            return;
        }

        await docRef.update({
            ownerUid: user.uid,
            deviceName: deviceName,
            claimed: true,
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert(`"${deviceName}" cihazı başarıyla eklendi!`);
        newDeviceIdInput.value = "";
        newDeviceNameInput.value = "";
    } catch (error) {
        alert("Cihaz ekleme hatası: " + error.message);
    } finally {
        addDeviceButton.disabled = false;
        addDeviceButton.textContent = "Cihaz Ekle";
    }
});

// --- KULLANICI VERİLERİNİ (YAŞ, TAKIM, ARABA) KAYDETME ---
const saveUserDataButton = document.getElementById('save-user-data-button');
const userAgeInput = document.getElementById('user-age');
const userTeamInput = document.getElementById('user-team');
const userCarModelInput = document.getElementById('user-car-model');

saveUserDataButton.addEventListener('click', async () => {
    const user = auth.currentUser;
    if (user) {
        const age = userAgeInput.value ? parseInt(userAgeInput.value) : null;
        const team = userTeamInput.value.trim();
        const carModel = userCarModelInput.value.trim();

        try {
            await db.collection("users").doc(user.uid).set({
                age: age,
                team: team,
                carModel: carModel,
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            alert("Kişisel bilgileriniz başarıyla kaydedildi!");
            // Bilgileri ekranda güncellemek için tekrar yükle
            loadUserData(user.uid);
        } catch (error) {
            console.error("Veri kaydetme hatası:", error);
            alert("Bilgileri kaydederken bir hata oluştu: " + error.message);
        }
    } else {
        alert("Lütfen önce oturum açın.");
    }
});

// Verileri Firestore'dan çekip ekrana yazdıran fonksiyon
async function loadUserData(uid) {
    try {
        const doc = await db.collection("users").doc(uid).get();
        
        // Elementleri burada tekrar tanımlayalım ki hata payı kalmasın
        const ageInput = document.getElementById('user-age');
        const teamInput = document.getElementById('user-team');
        const carInput = document.getElementById('user-car-model');
        const displayAge = document.getElementById('display-age');
        const displayTeam = document.getElementById('display-team');
        const displayCar = document.getElementById('display-car-model');
        const savedDataDiv = document.getElementById('saved-user-data');

        if (doc.exists) {
            const data = doc.data();
            
            // Input kutularını doldur
            if(ageInput) ageInput.value = data.age || '';
            if(teamInput) teamInput.value = data.team || '';
            if(carInput) carInput.value = data.carModel || '';

            // Alt taraftaki "Kaydedilmiş Bilgileriniz" kısmını doldur
            if(displayAge) displayAge.textContent = data.age || 'N/A';
            if(displayTeam) displayTeam.textContent = data.team || 'N/A';
            if(displayCar) displayCar.textContent = data.carModel || 'N/A';

            // Bilgi alanı gizliyse göster
            if(savedDataDiv) savedDataDiv.style.display = 'block';
            
            console.log("Kullanıcı verileri başarıyla yüklendi:", data);
        } else {
            console.log("Kullanıcıya ait kayıtlı döküman bulunamadı.");
        }
    } catch (error) {
        console.error("Veri yükleme hatası:", error);
    }
}

function listenUserDevices(uid) {
    db.collection("devices").where("ownerUid", "==", uid)
    .onSnapshot((snapshot) => {
        deviceListDiv.innerHTML = "";
        if (snapshot.empty) {
            deviceListDiv.innerHTML = "<p>Henüz kayıtlı bir cihazınız yok.</p>";
            return;
        }
        snapshot.forEach((doc) => {
            const device = doc.data();
            const id = doc.id;
            const card = document.createElement('div');
            card.style = "background:#fff; border:1px solid #ddd; padding:10px; margin-top:10px; border-radius:5px; display:flex; justify-content:space-between; align-items:center; gap:8px;";
            card.innerHTML = `
                <div style="flex:1;">
                    <strong>${device.deviceName}</strong><br>
                    <small style="color:#888;">Seri No: ${id}</small>
                </div>
                <button onclick="toggleDevice('${id}', ${device.status})"
                        style="background:${device.status ? '#28a745' : '#ea4335'}; color:white; border:none; padding:8px 15px; cursor:pointer; border-radius:4px; min-width:80px;">
                    ${device.status ? 'AÇIK' : 'KAPALI'}
                </button>
                <button onclick="removeDevice('${id}')"
                        style="background:#6c757d; color:white; border:none; padding:8px 12px; cursor:pointer; border-radius:4px;">
                    Sil
                </button>
            `;
            deviceListDiv.appendChild(card);
        });
    }, (error) => {
        console.error("Dinleme hatası:", error);
    });
}

window.toggleDevice = async (id, currentStatus) => {
    try {
        await db.collection("devices").doc(id).update({
            status: !currentStatus,
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (error) {
        alert("Durum güncellenemedi: " + error.message);
    }
};

window.removeDevice = async (id) => {
    if (!confirm(`"${id}" seri kodlu cihazı hesabınızdan kaldırmak istiyor musunuz?`)) return;
    try {
        await db.collection("devices").doc(id).update({
            ownerUid: firebase.firestore.FieldValue.delete(),
            deviceName: firebase.firestore.FieldValue.delete(),
            claimed: false,
            status: false,
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch (error) {
        alert("Cihaz kaldırılamadı: " + error.message);
    }
};

// 6. DURUM KONTROLÜ
auth.onAuthStateChanged((user) => {
    if (user) {
        document.getElementById('brand-title').style.display = 'block';
        googleSignInButton.style.display = 'none';
        signOutButton.style.display = 'inline-block';
        userInfoDiv.style.display = 'block';
        userDataForm.style.display = 'block';
        deviceManagementDiv.style.display = 'block';
        
        // Kullanıcı verilerini göster (Eski kodundaki kısımlar)
        document.getElementById('user-display-name').textContent = user.displayName;
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-uid').textContent = user.uid;

        listenUserDevices(user.uid);
        loadUserData(user.uid);
    } else {
        document.getElementById('brand-title').style.display = 'none';
        googleSignInButton.style.display = 'inline-block';
        signOutButton.style.display = 'none';
        userInfoDiv.style.display = 'none';
        userDataForm.style.display = 'none';
        deviceManagementDiv.style.display = 'none';
        deviceListDiv.innerHTML = "";
    }
});
    </script>
</body>
</html>
