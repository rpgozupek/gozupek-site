<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Google Oturum Açma Örneği</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; text-align: center; }
        #auth-container { margin-top: 30px; }
        #user-info { margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; display: none; text-align: left;}
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #google-signin-button { background-color: #4285f4; color: white; border: none; }
        #signout-button { background-color: #ea4335; color: white; border: none; }
    </style>
</head>
<body>
    <h1>Firebase Google Oturum Açma</h1>

    <div id="auth-container">
        <button id="google-signin-button">Googlee ile Oturum Aç</button>
        <button id="signout-button" style="display: none;">Oturumu Kapat</button>
    </div>

    <div id="user-info">
        <h2>Hoş Geldiniz!</h2>
        <p><strong>Kullanıcı Adı:</strong> <span id="user-display-name"></span></p>
        <p><strong>E-posta:</strong> <span id="user-email"></span></p>
        <p><strong>UID:</strong> <span id="user-uid"></span></p>
        <img id="user-photo" src="" alt="Kullanıcı Fotoğrafı" style="width: 50px; height: 50px; border-radius: 50%; margin-top: 10px; display: none;">
    </div>

    <!-- Firebase SDK Yükleme -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script>
        // TODO: Buradaki Firebase yapılandırma bilgilerini kendi projenizin bilgileriyle değiştirin.
        // Firebase Konsolu -> Proje Ayarları -> Uygulamalarım -> Web uygulamanız
        const firebaseConfig = {
            apiKey: "AIzaSyAK1NJ-dfAkrqESYN1ort95UnGJg-YWxAE",
            authDomain: "website-gozupekteknoloji.firebaseapp.com",
            projectId: "website-gozupekteknoloji",
            storageBucket: "website-gozupekteknoloji.firebasestorage.app",
            messagingSenderId: "941332210669",
            appId: "1:941332210669:web:9547087e4a6d126c173de4",
            measurementId: "G-RPLGF3F943" // İsteğe bağlı
        };

        // Firebase'i Başlat
        firebase.initializeApp(firebaseConfig);

        // Firebase Auth referansını al
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider(); //

        const googleSignInButton = document.getElementById('google-signin-button');
        const signOutButton = document.getElementById('signout-button');
        const userInfoDiv = document.getElementById('user-info');
        const userDisplayName = document.getElementById('user-display-name');
        const userEmail = document.getElementById('user-email');
        const userUid = document.getElementById('user-uid');
        const userPhoto = document.getElementById('user-photo');

        // Google ile Oturum Açma Fonksiyonu
        googleSignInButton.addEventListener('click', async () => {
            try {
                const result = await auth.signInWithPopup(googleProvider); //
                const user = result.user;
                console.log("Kullanıcı başarıyla oturum açtı:", user);
                // UI, onAuthStateChanged tarafından güncellenecek
            } catch (error) {
                console.error("Google ile oturum açma hatası:", error);
                alert("Oturum açma sırasında bir hata oluştu: " + error.message);
            }
        });

        // Oturumu Kapatma Fonksiyonu
        signOutButton.addEventListener('click', async () => {
            try {
                await auth.signOut(); //
                console.log("Kullanıcı oturumu kapattı.");
                // UI, onAuthStateChanged tarafından güncellenecek
            } catch (error) {
                console.error("Oturumu kapatma hatası:", error);
                alert("Oturumu kapatma sırasında bir hata oluştu: " + error.message);
            }
        });

        // Kimlik Doğrulama Durumu Değişikliklerini Dinle
        auth.onAuthStateChanged((user) => { //
            if (user) {
                // Kullanıcı oturum açmış
                googleSignInButton.style.display = 'none';
                signOutButton.style.display = 'inline-block';
                userInfoDiv.style.display = 'block';

                userDisplayName.textContent = user.displayName;
                userEmail.textContent = user.email;
                userUid.textContent = user.uid;

                if (user.photoURL) {
                    userPhoto.src = user.photoURL;
                    userPhoto.style.display = 'inline-block';
                } else {
                    userPhoto.style.display = 'none';
                }

                console.log("Kullanıcı durumu: Oturum açık", user);
            } else {
                // Kullanıcı oturum kapatmış
                googleSignInButton.style.display = 'inline-block';
                signOutButton.style.display = 'none';
                userInfoDiv.style.display = 'none';
                userDisplayName.textContent = '';
                userEmail.textContent = '';
                userUid.textContent = '';
                userPhoto.src = '';
                userPhoto.style.display = 'none';

                console.log("Kullanıcı durumu: Oturum kapalı");
            }
        });
    </script>
</body>
</html>
